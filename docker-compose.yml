version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: gameguard-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: gameguard
    networks:
      - gameguard-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gameguard-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongodb:27017/gameguard
      JWT_SECRET: ${JWT_SECRET:-change_this_in_production_at_least_32_chars}
      JWT_EXPIRES_IN: 7d
      EMAIL_HOST: ${EMAIL_HOST:-smtp.mailtrap.io}
      EMAIL_PORT: ${EMAIL_PORT:-2525}
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_PASS: ${EMAIL_PASS:-}
      EMAIL_FROM: noreply@gameguard.io
      OTP_SECRET_KEY: ${OTP_SECRET_KEY:-gameguard_2fa_base}
      FRONTEND_URL: http://localhost:3000
    depends_on:
      - mongodb
    networks:
      - gameguard-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gameguard-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - gameguard-net

volumes:
  mongo_data:

networks:
  gameguard-net:
    driver: bridge
